<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenPlan</title>
    <link rel="stylesheet" href="/katex/katex.min.css" />
    <script>
      // Apply theme before first paint to avoid a flash. This runs before the
      // app can migrate the pre-rename key, so it reads both.
      (function () {
        try {
          var stored =
            localStorage.getItem("openplan:theme") ??
            localStorage.getItem("openmarkdown:theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
