name: Build

on:
  push:
    tags: ["v*"]
    # Pushes to main only compile, to save the Rust cache that tag runs restore.
    branches: [main]
    paths:
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  BUNDLE: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
  PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  build:
    name: build (${{ matrix.platform }})
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: darwin-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          # The updater installs only the NSIS setup.exe.
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # A tag run can restore only the default branch's caches, so only branch runs save.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.target }}
          save-if: ${{ github.ref_type == 'branch' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      # The same compile as a release, without the bundles.
      - name: Compile
        if: env.BUNDLE != 'true'
        run: pnpm tauri build --target ${{ matrix.target }} --no-bundle

      - uses: tauri-apps/tauri-action@v0
        if: env.BUNDLE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # On tag pushes, create a draft release with installers attached.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('OpenPlan {0}', github.ref_name) || '' }}
          releaseDraft: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Write the platform's update manifest
        if: env.BUNDLE == 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
          HOST: ${{ vars.UPDATES_HOST }}
        run: |
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          VERSION="$APP_VERSION"
          NOTES="OpenPlan $VERSION"
          if [ "$PUBLISH" = true ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            # A tag that differs from the app's version would offer the same update forever.
            if [ "$VERSION" != "$APP_VERSION" ]; then
              echo "Tag $TAG does not match the app version $APP_VERSION" >&2
              exit 1
            fi
            # Checkout leaves a lightweight tag, so fetch the real one to read its message.
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git cat-file -t "$TAG")" = tag ]; then
              NOTES="$(git tag -l --format='%(contents)' "$TAG")"
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p "release/$PLATFORM" updates
          shopt -s nullglob
          cp src-tauri/target/${{ matrix.target }}/release/bundle/*/*.{dmg,tar.gz,exe,deb,rpm,AppImage,sig} "release/$PLATFORM/"
          node scripts/updater-manifest.mjs --platform "$PLATFORM" --version "$VERSION" --host "$HOST" \
            --notes "$NOTES" --dir "release/$PLATFORM" --out "updates/$PLATFORM.json"

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.PUBLISH == 'true'
        with:
          role-to-assume: ${{ vars.UPDATES_ROLE_ARN }}
          aws-region: ${{ vars.UPDATES_REGION }}

      # The bundles go up before the manifest that names them.
      - name: Publish the platform's update
        if: env.PUBLISH == 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
          BUCKET: ${{ vars.UPDATES_BUCKET }}
        run: |
          aws s3 cp release "s3://$BUCKET/releases/$VERSION/" --recursive \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "updates/$PLATFORM.json" "s3://$BUCKET/updates/$PLATFORM.json" \
            --cache-control "no-cache" --content-type application/json

      - name: Upload the manifest
        if: env.BUNDLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.platform }}
          path: updates/

      - name: Upload bundles
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: release/

  # Copies older than per-platform manifests read latest.json. It goes up only
  # after every platform built, so it never names a release missing a platform.
  publish:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: updates
          merge-multiple: true

      - name: Write latest.json
        run: |
          node scripts/updater-manifest.mjs --combine --out latest.json updates/*.json
          cat latest.json

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.PUBLISH == 'true'
        with:
          role-to-assume: ${{ vars.UPDATES_ROLE_ARN }}
          aws-region: ${{ vars.UPDATES_REGION }}

      - name: Upload latest.json
        if: env.PUBLISH == 'true'
        env:
          BUCKET: ${{ vars.UPDATES_BUCKET }}
        run: |
          aws s3 cp latest.json "s3://$BUCKET/latest.json" \
            --cache-control "no-cache" --content-type application/json
