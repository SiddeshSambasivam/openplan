<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1176 232" role="img" aria-label="The plan lifecycle: Draft, Alignment, In progress, In review, Completed, Archived" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#6B6560" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <circle cx="18" cy="120.0" r="6" fill="#100E0D"/>
  <line x1="27" y1="120.0" x2="58" y2="120.0" stroke="#B9B1A6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="64" y="96" width="128" height="48" rx="24.0" fill="#FFFFFF" stroke="#B9B1A6" stroke-width="1.25"/>
  <text x="128.0" y="125.5" font-size="16" font-weight="500" fill="#100E0D" text-anchor="middle">Draft</text>
  <rect x="256" y="96" width="128" height="48" rx="24.0" fill="#F5F0E8" stroke="#100E0D" stroke-width="1.75"/>
  <text x="320.0" y="125.5" font-size="16" font-weight="600" fill="#100E0D" text-anchor="middle">Alignment</text>
  <rect x="448" y="96" width="128" height="48" rx="24.0" fill="#FFFFFF" stroke="#B9B1A6" stroke-width="1.25"/>
  <text x="512.0" y="125.5" font-size="16" font-weight="500" fill="#100E0D" text-anchor="middle">In progress</text>
  <rect x="640" y="96" width="128" height="48" rx="24.0" fill="#FFFFFF" stroke="#B9B1A6" stroke-width="1.25"/>
  <text x="704.0" y="125.5" font-size="16" font-weight="500" fill="#100E0D" text-anchor="middle">In review</text>
  <rect x="832" y="96" width="128" height="48" rx="24.0" fill="#FFFFFF" stroke="#B9B1A6" stroke-width="1.25"/>
  <text x="896.0" y="125.5" font-size="16" font-weight="500" fill="#100E0D" text-anchor="middle">Completed</text>
  <rect x="1024" y="96" width="128" height="48" rx="24.0" fill="#FFFFFF" stroke="#B9B1A6" stroke-width="1.25"/>
  <text x="1088.0" y="125.5" font-size="16" font-weight="500" fill="#100E0D" text-anchor="middle">Archived</text>
  <line x1="196" y1="120.0" x2="250" y2="120.0" stroke="#B9B1A6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="224.0" y="108.0" font-size="13.5" fill="#6B6560" text-anchor="middle">review</text>
  <line x1="388" y1="120.0" x2="442" y2="120.0" stroke="#B9B1A6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="416.0" y="108.0" font-size="13.5" fill="#6B6560" text-anchor="middle">Build</text>
  <text x="416.0" y="164.0" font-size="13.5" fill="#6B6560" text-anchor="middle">at your target</text>
  <line x1="580" y1="120.0" x2="634" y2="120.0" stroke="#B9B1A6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="608.0" y="108.0" font-size="13.5" fill="#6B6560" text-anchor="middle">done</text>
  <line x1="772" y1="120.0" x2="826" y2="120.0" stroke="#B9B1A6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800.0" y="108.0" font-size="13.5" fill="#6B6560" text-anchor="middle">merged</text>
  <text x="800.0" y="164.0" font-size="13.5" fill="#6B6560" text-anchor="middle">you confirm</text>
  <line x1="964" y1="120.0" x2="1018" y2="120.0" stroke="#B9B1A6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="992.0" y="108.0" font-size="13.5" fill="#6B6560" text-anchor="middle"></text>
  <path d="M294.0 94 C286.0 42 354.0 42 346.0 92" fill="none" stroke="#B9B1A6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320.0" y="42" font-size="13.5" fill="#6B6560" text-anchor="middle">1 to 3 questions per review round</text>
  <path d="M704.0 146 C704.0 192 512.0 192 512.0 150" fill="none" stroke="#B9B1A6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="608.0" y="208" font-size="13.5" fill="#6B6560" text-anchor="middle">a new todo</text>
</svg>
