[package]
name = "openplan-core"
version = "0.3.0"
description = "The OpenPlan file contract: plan base layout, atomic writes, and comment sidecars"
authors = ["Siddesh Sambasivam"]
edition = "2021"

[dependencies]
dirs = "6.0.0"
git2 = { version = "0.21.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
