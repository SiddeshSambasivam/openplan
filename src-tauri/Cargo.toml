[workspace]
members = ["crates/*"]

[package]
name = "openplan"
version = "0.1.0"
description = "One place to manage the plans you and your coding agents collaborate on"
authors = ["Siddesh Sambasivam"]
edition = "2021"

[lib]
name = "openplan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openplan-core = { path = "crates/openplan-core" }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
