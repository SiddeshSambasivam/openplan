[workspace]
members = ["crates/*"]

[package]
name = "openplan-app"
version = "0.6.0"
description = "One place to manage the plans you and your coding agents collaborate on"
authors = ["Siddesh Sambasivam"]
edition = "2021"

[lib]
name = "openplan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The package, binary, and bundle are all openplan-app; plain `openplan`
# is the CLI's name, in the workspace target directory and as the sidecar.
[[bin]]
name = "openplan-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openplan-core = { path = "crates/openplan-core" }
notify = "8.2.0"
dirs = "6.0.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
